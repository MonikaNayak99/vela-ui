# SPDX-License-Identifier: Apache-2.0

# name of the action
name: renovate

# trigger on schedule or manual run
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# pipeline to execute
jobs:
  renovate:
    runs-on: ubuntu-latest

    permissions:
      contents: write # for renovate to push its update branches
      pull-requests: write # for renovate to open and update pull requests
      statuses: write # for renovate to set branch status checks
      vulnerability-alerts: read # for renovate to read dependabot alerts

    steps:
      - name: renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          token: ${{ secrets.github_token }}
